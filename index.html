<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الموقع الإلكتروني</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      line-height: 1.6;
    }

    header {
      background-color: #1e293b;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.5rem;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin-right: 15px;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #38bdf8;
    }

    .container {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-block;
      background-color: #0284c7;
      color: #fff;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #0369a1;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      background-color: #0f172a;
      color: #94a3b8;
      position: fixed;
      width: 100%;
      bottom: 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>اسم الموقع</h1>
    <nav>
      <a href="#home">الرئيسية</a>
      <a href="#services">الخدمات</a>
      <a href="#contact">تواصل معنا</a>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <h2>مرحباً بك</h2>
      <p>تم استعادة محتوى الموقع وتصحيح الكود بالكامل. يمكنك الآن البدء بإضافة تفاصيل مشروعك.</p>
      <br>
      <button class="btn" onclick="checkStatus()">تحقق من الحالة</button>
      <p id="status-message" style="margin-top: 10px; font-weight: bold;"></p>
    </div>
  </div>

  <footer>
    <p>جميع الحقوق محفوظة &copy; 2026</p>
  </footer>

  <script>
    function checkStatus() {
      const message = document.getElementById('status-message');
      message.innerText = 'الكود يعمل بشكل ممتاز تماماً!';
      message.style.color = '#16a34a';
    }
  </script>

</body>
</html>
